[project]
name = "pyapcupsdexporter"
version = "0.3.0"
description = "APC UPS Exporter to InfluxDB"
authors = [{ name = "Daniel A", email = "xNinjaKittyx@users.noreply.github.com" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "influxdb-client>=1.48.0,<2",
    "apcaccess>=0.0.13,<0.0.14",
    "requests>=2.32.3,<3",
]


[project.urls]
Repository = "https://github.com/xNinjaKittyx/pyapcupsdexporter"
"Bug Tracker" = "https://github.com/xNinjaKittyx/pyapcupsdexporter/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
per-file-ignores = {}

# Same as Black.
line-length = 120
target-version = "py312"
